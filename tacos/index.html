<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Kaushan+Script&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#0E0F0C}
a{color:#7FE0A6}a:hover{color:#B5F0CB}
*{box-sizing:border-box}
@keyframes te-spin{from{background-position:0 0,0 0}to{background-position:0 0,208px 0}}
@keyframes te-spin-pina{from{background-position:0 0}to{background-position:60px 0}}
@keyframes te-flame{0%,100%{transform:scaleY(1) scaleX(1);opacity:.95}25%{transform:scaleY(1.12) scaleX(.94);opacity:1}50%{transform:scaleY(.9) scaleX(1.05);opacity:.85}75%{transform:scaleY(1.08) scaleX(.97);opacity:1}}
@keyframes te-glow{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.8;transform:scale(1.06)}}
@keyframes te-ember{0%{transform:translate(0,0) scale(1);opacity:0}10%{opacity:1}100%{transform:translate(var(--dx),-340px) scale(.3);opacity:0}}
@keyframes te-knife{0%,55%,100%{transform:translate(0,0) rotate(-28deg)}70%{transform:translate(-14px,110px) rotate(-20deg)}85%{transform:translate(-4px,40px) rotate(-26deg)}}
@keyframes te-slice{0%,60%{opacity:0;transform:translate(0,0) rotate(0)}68%{opacity:1}100%{opacity:0;transform:translate(36px,170px) rotate(160deg)}}
@keyframes te-marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes te-rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes te-pulse{0%,100%{box-shadow:0 0 0 0 rgba(31,160,90,.55)}70%{box-shadow:0 0 0 16px rgba(31,160,90,0)}}
.te-meat{animation:te-spin 3.2s linear infinite}
.te-pina{animation:te-spin-pina 3.2s linear infinite}
.te-flame{transform-origin:50% 100%;animation:te-flame 0.9s ease-in-out infinite}
.te-glow{animation:te-glow 2.4s ease-in-out infinite}
.te-ember{animation:te-ember 3.6s linear infinite}
.te-knife{transform-origin:90% 10%;animation:te-knife 2.6s ease-in-out infinite}
.te-slice{animation:te-slice 2.6s ease-in infinite}
.te-marquee{animation:te-marquee 28s linear infinite}
.te-rise{animation:te-rise .8s cubic-bezier(.2,.7,.2,1) both}
.te-pulse{animation:te-pulse 2.2s ease-out infinite}
.te-card{transition:transform .25s ease,border-color .25s ease}
.te-card:hover{transform:translateY(-4px);border-color:#2BB56A}
@keyframes te-float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
@keyframes te-ring{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes te-pop{0%{opacity:0;transform:scale(.7) rotate(-6deg)}60%{opacity:1;transform:scale(1.06) rotate(2deg)}100%{opacity:1;transform:scale(1) rotate(-2deg)}}
@keyframes te-wobble{0%,100%{transform:rotate(var(--r))}50%{transform:rotate(calc(var(--r) * -1))}}
.te-float{animation:te-float 4.5s ease-in-out infinite}
.te-ring{animation:te-ring 14s linear infinite}
.te-pop{animation:te-pop .55s cubic-bezier(.2,.8,.2,1) both}
.te-wobble{animation:te-wobble 3.4s ease-in-out infinite}
.te-fab{transition:transform .2s ease}
.te-fab:hover{transform:scale(1.08)}
@keyframes te-bubble{0%,70%,100%{opacity:1;transform:translateY(0)}80%{transform:translateY(-4px)}}
.te-bubble{animation:te-bubble 3s ease-in-out infinite}
.te-faq summary::-webkit-details-marker{display:none}
@media (max-width: 640px){.te-bubble{display:none}}
@media (prefers-reduced-motion: reduce){.te-bubble{animation:none!important}}
@media (prefers-reduced-motion: reduce){.te-float,.te-ring,.te-pop,.te-wobble{animation:none!important}}
@keyframes te-sprite{from{background-position:0 0}to{background-position:-6240px 0}}
@keyframes te-coils{0%,100%{opacity:.85}30%{opacity:1}60%{opacity:.75}}
.te-coils{animation:te-coils 1.3s ease-in-out infinite}
@keyframes te-drip{0%{transform:translateY(0) scaleY(.6);opacity:0}15%{opacity:1}100%{transform:translateY(34px) scaleY(1.2);opacity:0}}
.te-drip{animation:te-drip 1.8s ease-in infinite}
@keyframes te-smoke{0%{transform:translate(0,0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translate(20px,-120px) scale(2.2);opacity:0}}
.te-smoke{animation:te-smoke 5s ease-out infinite}
@media (prefers-reduced-motion: reduce){.te-sprite,.te-coils,.te-drip,.te-smoke{animation:none!important}}
@keyframes te-kb{0%{transform:scale(1.04) translateY(0)}50%{transform:scale(1.12) translateY(-2%)}100%{transform:scale(1.04) translateY(0)}}
.te-kenburns{animation:te-kb 14s ease-in-out infinite;transform-origin:50% 40%}
@keyframes te-firefl{0%,100%{opacity:.7}20%{opacity:1}45%{opacity:.55}70%{opacity:.9}}
.te-fire{animation:te-firefl 1.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.te-kenburns,.te-fire{animation:none!important}}
@media (prefers-reduced-motion: reduce){.te-meat,.te-pina,.te-flame,.te-glow,.te-ember,.te-knife,.te-slice,.te-marquee,.te-rise,.te-pulse{animation:none!important}}
</style>

</head>
<body>
<div id="app"></div>
<template id="tpl">

<div style="width: 100%; background: #0E0F0C; color: #F4F1EA; font-family: Inter, system-ui, sans-serif; overflow-x: hidden">

  <!-- Barra superior -->
  <header style="position: sticky; top: 0; z-index: 40; width: 100%; border-bottom: 1px solid #22241C; background: rgba(14,15,12,.88); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px)">
    <div style="max-width: 1200px; margin: 0 auto; padding: 12px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px">
      <a href="#inicio" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #F4F1EA">
        <img src="img/logo.jpg" alt="" style="width: 66px; height: 66px; border-radius: 50%; object-fit: cover; display: block; border: 2px solid #2BB56A">
        <span style="display: flex; flex-direction: column; line-height: 1">
          <span style="font-family: Anton, Impact, sans-serif; font-size: 24px; letter-spacing: 1px">TACOS ESMERALDA</span>
          <span style="font-family: 'Kaushan Script', cursive; font-size: 16px; color: #8FD9A8; margin-top: 4px">Taqueros de corazón</span>
        </span>
      </a>
      <nav aria-label="Principal" style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 22px; font-size: 15px; font-weight: 500">
        <a href="#taquiza" style="color: #E8E4DA; text-decoration: none; padding: 10px 0">Taquiza</a>
        <a href="#extras" style="color: #E8E4DA; text-decoration: none; padding: 10px 0">Tortas y gringas</a>
        <a href="#guisados" style="color: #E8E4DA; text-decoration: none; padding: 10px 0">Guisados</a>
        <a href="#cotiza" style="color: #E8E4DA; text-decoration: none; padding: 10px 0">Cotiza</a>
        <a href="#juego" style="color: #F29A2E; text-decoration: none; padding: 10px 0; font-weight: 700">Juega</a>
        <a href="https://wa.me/525650886350?text=Hola%20Tacos%20Esmeralda%2C%20quiero%20informes%20para%20un%20evento" style="display: inline-flex; align-items: center; gap: 8px; background: #178A4A; color: #FFFFFF; text-decoration: none; padding: 12px 18px; border-radius: 999px; font-weight: 700">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.3 7.5L3 21l2-5.5A8.5 8.5 0 1 1 21 11.5z"></path></svg>
          WhatsApp
        </a>
        <a href="https://www.facebook.com/search/top?q=Tacos%20Esmeralda" target="_blank" rel="noopener" aria-label="Tacos Esmeralda en Facebook" style="display: inline-flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 50%; background: #1877F2; color: #FFFFFF"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 21v-7.5h2.5l.4-3H13.5V8.6c0-.9.3-1.5 1.5-1.5h1.6V4.4c-.3 0-1.2-.1-2.3-.1-2.3 0-3.8 1.4-3.8 3.9v2.3H8v3h2.5V21z"></path></svg></a>
      </nav>
    </div>
  </header>

  <!-- Hero con trompo animado -->
  <section id="inicio" style="width: 100%; background: #0E0F0C; position: relative">
    <div style="max-width: 1200px; margin: 0 auto; padding: 48px 24px 56px; display: flex; flex-wrap: wrap; align-items: center; gap: 32px">
      <div class="te-rise" style="flex: 999 1 500px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 20px">
          <div class="te-float" style="position: relative; width: 150px; height: 150px; flex: none">
            <div class="te-ring" aria-hidden="true" style="position: absolute; inset: -10px; border-radius: 50%; border: 3px dashed #2BB56A"></div>
            <img src="img/logo.jpg" alt="Logo de Tacos Esmeralda" style="width: 150px; height: 150px; border-radius: 50%; object-fit: cover; display: block; border: 4px solid #F4F1EA; box-shadow: 0 0 40px rgba(43,181,106,.45)">
          </div>
          <div style="display: flex; flex-direction: column; gap: 10px; min-width: 0">
            <span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; background: #17241B; color: #8FE3B0; border: 1px solid #2F5A3E; padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 600">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
              Cuautitlán Izcalli y alrededores
            </span>
            <div aria-live="polite" style="position: relative; align-self: flex-start; background: #F4F1EA; color: #0E0F0C; border-radius: 18px 18px 18px 4px; padding: 10px 18px; min-height: 48px; display: flex; align-items: center">
              <sc-if value="{{phraseEven}}" hint-placeholder-val="{{ true }}">
                <span class="te-pop" style="font-family: 'Kaushan Script', cursive; font-size: 24px; line-height: 1.1; white-space: nowrap">{{phraseText}}</span>
              </sc-if>
              <sc-if value="{{phraseOdd}}" hint-placeholder-val="{{ false }}">
                <strong class="te-pop" style="font-family: 'Kaushan Script', cursive; font-weight: 400; font-size: 24px; line-height: 1.1; white-space: nowrap">{{phraseText}}</strong>
              </sc-if>
            </div>
          </div>
        </div>
        <h1 style="margin: 0; font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: clamp(54px, 8.5vw, 108px); line-height: 0.92; text-transform: uppercase">
          Taquiza <span style="color: #2BB56A">al pastor</span> <span style="display: block; color: #F29A2E">de trompo</span>
        </h1>
        <p style="margin: 0; font-size: 19px; line-height: 1.55; color: #CFCBC0; max-width: 560px">2 horas de taquero sirviendo al momento en tu fiesta, boda o XV años. Rinde de <strong style="color: #F4F1EA">8 a 10 tacos por persona</strong> y <strong style="color: #F4F1EA">la carne que sobre se queda contigo</strong>.</p>
        <div style="display: flex; flex-wrap: wrap; gap: 12px">
          <div style="background: #178A4A; border-radius: 16px; padding: 12px 18px; display: flex; align-items: baseline; gap: 10px">
            <span style="font-family: Anton, Impact, sans-serif; font-size: 46px; line-height: 1">$150</span>
            <span style="font-size: 14px; font-weight: 600; line-height: 1.3">por persona<br>desde 50 personas</span>
          </div>
          <div style="background: #1A1C15; border: 1px solid #33362B; border-radius: 16px; padding: 12px 18px; display: flex; align-items: baseline; gap: 10px">
            <span style="font-family: Anton, Impact, sans-serif; font-size: 46px; line-height: 1; color: #8FE3B0">$850</span>
            <span style="font-size: 14px; font-weight: 600; line-height: 1.3; color: #CFCBC0">paquete de<br>guisados desde</span>
          </div>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 4px">
          <a class="te-pulse" href="#cotiza" style="display: inline-flex; align-items: center; justify-content: center; min-height: 56px; padding: 0 28px; border-radius: 14px; background: #1FA05A; color: #FFFFFF; font-weight: 800; font-size: 17px; text-decoration: none">Cotiza tu evento</a>
          <a href="tel:+525650886350" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; padding: 0 22px; border-radius: 14px; border: 1.5px solid #4A4C40; color: #F4F1EA; font-weight: 600; font-size: 17px; text-decoration: none">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"></path></svg>
            56 5088 6350
          </a>
        </div>
      </div>

      <!-- Trompo (foto real) -->
      <div style="flex: 1 1 340px; min-width: 0; display: flex; justify-content: center">
        <div style="position: relative; width: 360px; max-width: 100%">
          <div class="te-glow" aria-hidden="true" style="position: absolute; inset: -40px; border-radius: 50%; background: radial-gradient(circle, rgba(242,120,40,.35) 0%, rgba(14,15,12,0) 65%)"></div>
          <div style="position: relative; width: 100%; aspect-ratio: 293 / 860; max-height: 620px; border-radius: 28px; overflow: hidden; border: 3px solid #2BB56A; box-shadow: 0 24px 60px rgba(0,0,0,.6); background: #1A1C15">
            <img class="te-kenburns" src="img/trompo.jpg" alt="Trompo de pastor de Tacos Esmeralda, cortando la carne al momento" style="width: 100%; height: 100%; object-fit: cover; display: block">
            <div class="te-fire" aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(0deg, rgba(255,110,30,.35) 0%, rgba(255,110,30,0) 45%); mix-blend-mode: screen"></div>
            <div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(14,15,12,0) 70%, rgba(14,15,12,.75) 100%)"></div>
            <span class="te-ember" aria-hidden="true" style="position: absolute; left: 22%; bottom: 60px; width: 4px; height: 4px; border-radius: 50%; background: #FFC24B; box-shadow: 0 0 6px #FF9A2E; --dx: -20px"></span>
            <span class="te-ember" aria-hidden="true" style="position: absolute; left: 60%; bottom: 80px; width: 3px; height: 3px; border-radius: 50%; background: #FFE08A; box-shadow: 0 0 6px #FFC24B; --dx: 16px; animation-delay: -1.4s"></span>
            <span class="te-ember" aria-hidden="true" style="position: absolute; left: 40%; bottom: 50px; width: 4px; height: 4px; border-radius: 50%; background: #FF8A3D; box-shadow: 0 0 6px #FF9A2E; --dx: 8px; animation-delay: -2.6s"></span>
            <span style="position: absolute; left: 16px; bottom: 16px; background: #F4F1EA; color: #0E0F0C; padding: 8px 14px; border-radius: 12px; font-family: 'Kaushan Script', cursive; font-size: 20px">Cortado al momento</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Cinta en movimiento -->
  <div style="width: 100%; background: #1FA05A; color: #0E0F0C; overflow: hidden; border-top: 2px solid #0E0F0C; border-bottom: 2px solid #0E0F0C">
    <div class="te-marquee" aria-hidden="true" style="display: flex; width: max-content; gap: 36px; padding: 14px 0; font-family: Anton, Impact, sans-serif; font-size: 26px; letter-spacing: 1px; text-transform: uppercase; white-space: nowrap">
      <span>¿Con todo, jefe?</span><span>◆</span><span>Taquiza al pastor</span><span>◆</span><span>¿Le pongo piñita?</span><span>◆</span><span>Tortas y gringas</span><span>◆</span><span>¿Roja o verde? ¡Las dos!</span><span>◆</span><span>La carne que sobra es tuya</span><span>◆</span><span>Pásele, hay de pastor</span><span>◆</span>
      <span>¿Con todo, jefe?</span><span>◆</span><span>Taquiza al pastor</span><span>◆</span><span>¿Le pongo piñita?</span><span>◆</span><span>Tortas y gringas</span><span>◆</span><span>¿Roja o verde? ¡Las dos!</span><span>◆</span><span>La carne que sobra es tuya</span><span>◆</span><span>Pásele, hay de pastor</span><span>◆</span>
    </div>
  </div>

  <!-- Frases taqueras -->
  <section aria-label="Frases taqueras" style="width: 100%; background: #0E0F0C; position: relative; overflow: hidden">
    <div style="max-width: 1200px; margin: 0 auto; padding: 80px 24px; display: flex; flex-direction: column; align-items: center; gap: 36px">
      <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; max-width: 980px">
        <span class="te-wobble" style="--r: -4deg; background: #1FA05A; color: #FFFFFF; padding: 12px 20px; border-radius: 14px; font-family: Anton, Impact, sans-serif; font-size: 26px; text-transform: uppercase">¿Con todo, jefe?</span>
        <span class="te-wobble" style="--r: 3deg; animation-delay: -.6s; background: #F29A2E; color: #0E0F0C; padding: 12px 20px; border-radius: 14px; font-family: Anton, Impact, sans-serif; font-size: 26px; text-transform: uppercase">¿Le pongo piñita?</span>
        <span class="te-wobble" style="--r: -2deg; animation-delay: -1.2s; background: #F4F1EA; color: #0E0F0C; padding: 12px 20px; border-radius: 14px; font-family: Anton, Impact, sans-serif; font-size: 26px; text-transform: uppercase">¿Cuántos van?</span>
        <span class="te-wobble" style="--r: 4deg; animation-delay: -1.8s; background: #E8572A; color: #0E0F0C; padding: 12px 20px; border-radius: 14px; font-family: Anton, Impact, sans-serif; font-size: 26px; text-transform: uppercase">¡Uno más y ya!</span>
      </div>
      <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 40px">
        <div class="te-float" style="position: relative; width: 260px; height: 260px; flex: none">
          <div class="te-ring" aria-hidden="true" style="position: absolute; inset: -16px; border-radius: 50%; border: 3px dashed #F29A2E"></div>
          <img src="img/logo.jpg" alt="Logo de Tacos Esmeralda" style="width: 260px; height: 260px; border-radius: 50%; object-fit: cover; display: block; border: 5px solid #F4F1EA; box-shadow: 0 0 70px rgba(242,154,46,.35)">
        </div>
        <div style="flex: 1 1 380px; min-width: 0; max-width: 560px; display: flex; flex-direction: column; gap: 14px">
          <p style="margin: 0; font-family: 'Kaushan Script', cursive; font-size: clamp(34px, 4.5vw, 52px); line-height: 1.1; color: #2BB56A">Taqueros de corazón</p>
          <p style="margin: 0; font-family: Anton, Impact, sans-serif; font-size: clamp(34px, 4.5vw, 54px); line-height: 1.02; text-transform: uppercase">El taco no se pide, <span style="color: #F29A2E">se antoja</span></p>
          <p style="margin: 0; font-size: 17px; line-height: 1.6; color: #CFCBC0">Con cebollita, cilantro y salsa de la que pica. Así servimos en cada evento.</p>
        </div>
      </div>
      <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; max-width: 980px">
        <span class="te-wobble" style="--r: 3deg; animation-delay: -.3s; background: #F4F1EA; color: #0E0F0C; padding: 12px 20px; border-radius: 14px; font-family: Anton, Impact, sans-serif; font-size: 26px; text-transform: uppercase">¿Roja o verde? ¡Las dos!</span>
        <span class="te-wobble" style="--r: -3deg; animation-delay: -.9s; background: #1FA05A; color: #FFFFFF; padding: 12px 20px; border-radius: 14px; font-family: Anton, Impact, sans-serif; font-size: 26px; text-transform: uppercase">Pásele, hay de pastor</span>
        <span class="te-wobble" style="--r: 2deg; animation-delay: -1.5s; background: #E8572A; color: #0E0F0C; padding: 12px 20px; border-radius: 14px; font-family: Anton, Impact, sans-serif; font-size: 26px; text-transform: uppercase">Con cebollita y cilantro</span>
      </div>
    </div>
  </section>

  <!-- Juego -->
  <section id="juego" style="width: 100%; background: #0E0F0C">
    <div style="max-width: 1200px; margin: 0 auto; padding: 84px 24px; display: flex; flex-wrap: wrap; gap: 40px; align-items: center">
      <div style="flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 16px">

  gTick() {
